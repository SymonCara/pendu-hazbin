    <style>
        /* --- STYLE DU JEU --- */
        body {
            font-family: 'Special Elite', monospace;
            color: #fce8f3;
            background-color: #000;
            background-image: radial-gradient(circle, #2b0000 0%, #000000 100%); 
            min-height: 100vh;
            /* Centrage vertical global */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto; /* Scroll seulement si vraiment nécessaire */
        }
        
        body.bg-loaded {
            background-image: url('./image/backround.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Animations */
        @keyframes pulse-text-glow {
            0%, 100% { text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000, 0 0 15px #ff4d4d; }
            50% { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff4d4d, 0 0 30px #ff4d4d; }
        }
        @keyframes pulse-border-glow {
            0%, 100% { border-color: #ff0000; box-shadow: 0 0 20px #ff0000; }
            50% { border-color: #ff4d4d; box-shadow: 0 0 30px #ff4d4d, 0 0 10px #ff0000; }
        }
        @keyframes appear-dramatic {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            60% { transform: scale(1.1) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0); }
        }

        .title-font {
            font-family: 'Cinzel Decorative', cursive;
            color: #ff0000;
            text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000, 0 0 15px #ff4d4d;
            animation: pulse-text-glow 2.5s ease-in-out infinite;
        }
        .game-container, .lobby-container, .modal-container, .auth-container {
            backdrop-filter: blur(5px);
            background-color: rgba(30, 0, 0, 0.6);
            border: 2px solid #ff0000;
            box-shadow: 0 0 20px #ff0000;
            animation: pulse-border-glow 2.5s ease-in-out infinite;
        }
        
        .word-display-letter {
            font-family: 'Special Elite', monospace;
            font-weight: bold;
            color: #ffd700;
            border-bottom: 3px solid #ffd700;
            width: 1.2em;
            height: 1.8em;
            line-height: 1.8em;
        }
        .key {
            background-color: rgba(50, 0, 10, 0.8);
            border: 1px solid #ff0000;
            color: #fce8f3;
            transition: all 0.2s ease;
        }
        .key:hover:not(:disabled) {
            background-color: #ff0000;
            color: #000;
            transform: scale(1.1);
        }
        .key:disabled {
            background-color: #333;
            color: #666;
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .hangman-part { stroke: #ffd700; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; visibility: hidden; }
        .gallows-part { stroke: #cc0000; stroke-width: 7; fill: none; }
        
        .replay-button, .lobby-button {
            background-color: #ffd700;
            color: #1a0000;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .replay-button:hover, .lobby-button:hover {
            background-color: #ff0000;
            color: #fff;
            box-shadow: 0 0 15px #ff0000;
        }
        .auth-input {
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid #ff0000;
            color: #ffd700;
            padding: 0.75rem;
            border-radius: 0.5rem;
            width: 100%;
            margin-bottom: 1rem;
            outline: none;
        }
        .difficulty-button { background-color: #b8860b; color: #1a0000; }
        .difficulty-button.difficile { background-color: #cc0000; color: #fff; }
        
        .category-selection-button {
            background-color: rgba(50, 0, 10, 0.8);
            border: 1px solid #ff0000;
            color: #fce8f3;
            width: 100%; margin-bottom: 0.5rem; padding: 0.75rem;
        }
        .category-selection-button:hover { background-color: #ff0000; color: #000; }

        .demon-image {
            max-height: 250px;
            width: auto;
            margin-bottom: 1rem;
            animation: appear-dramatic 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            filter: drop-shadow(0 0 20px #ff0000);
            border-radius: 10px;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a0000; }
        ::-webkit-scrollbar-thumb { background: #800000; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff0000; }

<body class="p-2">

        <p id="loading-msg" class="text-yellow-500 text-sm mt-2 hidden">Connexion au serveur...</p>
    </div>

    <!-- Lobby -->

        <button id="logout-btn" class="text-xs text-red-400 underline mb-6 hover:text-white">Se déconnecter</button>
        <div class="flex gap-4 mb-4">
            <button id="create-game-facile-btn" class="lobby-button difficulty-button w-1/2 py-3 px-4 rounded-lg">Créer (Facile)</button>
            <button id="create-game-difficile-btn" class="lobby-button difficulty-button difficile w-1/2 py-3 px-4 rounded-lg">Créer (Difficile)</button>
        </div>
        <div class="lobby-separator text-lg text-yellow-500 font-bold my-2">- OU -</div>
        <h2 class="text-xl text-yellow-300">Parties en cours</h2>
        <div id="active-games-list" class="lobby-game-list border border-red-500 rounded mt-4 p-2 bg-black/30 min-h-[100px] max-h-[200px] overflow-y-auto">
            <p id="no-games-message" class="text-gray-400 p-4">Aucune partie en cours...</p>
        </div>
        <div class="leaderboard-container mt-6 border-t border-gray-600 pt-4">

    </div>

                        <path d="M133 70 L137 74 M137 70 L133 74" class="hangman-part" stroke="red" />

                    </g>
                </svg>
                
                <p class="text-lg text-red-400 mt-1">Vies: <span id="guesses-left" class="font-bold text-xl text-red-300">8</span></p>
                
                <!-- Scores sous le pendu -->
                <div class="w-full max-w-[280px] mt-2">
                    <h3 class="text-yellow-500 text-sm font-bold uppercase border-b border-red-900 mb-1">Joueurs</h3>
                    <div id="scores-list" class="text-left text-sm bg-black/60 border border-red-900/50 p-2 rounded shadow-inner max-h-[100px] overflow-y-auto">
                        <p class="text-gray-500 italic">En attente...</p>
                    </div>
                </div>
            </div>
            
            <!-- Mot à deviner (Droite/Centre) -->

                <div id="word-display" class="flex flex-wrap justify-center items-center gap-2 mb-2 min-h-[60px]">
                    <div class="text-2xl text-yellow-300">Chargement...</div>
                </div>
            </div>
        </div>
        
        <!-- Clavier (Tout en bas) -->
        <div class="mt-2 pt-2 w-full border-t border-red-900/30">
            <div id="keyboard" class="flex flex-wrap justify-center gap-1 max-w-3xl mx-auto">
                <!-- Clavier généré ici -->

        </div>

            <div class="flex gap-6">

    </div>

                img: document.getElementById('lose-image'),
                finalScores: document.getElementById('final-scores-list'),
                scoresList: document.getElementById('scores-list')
            },
            modal: document.getElementById('category-selection-modal'),
            catList: document.getElementById('category-list-container')
        };

        let myPseudoID = null;
        let myPseudoName = null;
        let currentGameId = null;
        let unsubGame = null;

        async function initNetwork() {
            try {
                DOM.loader.classList.remove('hidden');
                await signInAnonymously(auth);
                DOM.loader.classList.add('hidden');
            } catch (e) {
                console.error(e);
                DOM.authErr.textContent = "Erreur connexion serveur (vérifiez votre internet).";
            }
        }

        function sanitize(str) { return str.toLowerCase().trim().replace(/[^a-z0-9]/g, ''); }

        async function register() {
            const pseudo = DOM.authPseudo.value.trim();
            const pass = DOM.authPass.value;
            if(pseudo.length < 3 || pass.length < 4) { DOM.authErr.textContent = "Pseudo (3+) ou MDP (4+) trop court."; return; }
            const id = sanitize(pseudo);
            DOM.authErr.textContent = "Inscription...";
            try {
                const ref = doc(db, "users", id);
                const snap = await getDoc(ref);
                if(snap.exists()) {
                    DOM.authErr.textContent = "Ce pseudo est déjà pris !";
                } else {
                    await setDoc(ref, { username: pseudo, password: pass, score: 0 });
                    loginSuccess(id, pseudo);
                }
            } catch(e) { DOM.authErr.textContent = "Erreur DB: " + e.message; }
        }

        async function login() {
            const pseudo = DOM.authPseudo.value.trim();
            const pass = DOM.authPass.value;
            if(!pseudo || !pass) return;
            const id = sanitize(pseudo);
            DOM.authErr.textContent = "Connexion...";
            try {
                const snap = await getDoc(doc(db, "users", id));
                if(!snap.exists()) {
                    DOM.authErr.textContent = "Compte introuvable.";
                } else {
                    if(snap.data().password === pass) {
                        loginSuccess(id, snap.data().username);
                    } else {
                        DOM.authErr.textContent = "Mauvais mot de passe.";
                    }
                }
            } catch(e) { DOM.authErr.textContent = "Erreur DB: " + e.message; }
        }

        function loginSuccess(id, name) {
            myPseudoID = id;
            myPseudoName = name;
            DOM.auth.classList.add('hidden');
            DOM.lobby.classList.remove('hidden');
            DOM.displays.user.textContent = name;
            startLobbyListeners();
        }

        function startLobbyListeners() {
            onSnapshot(collection(db, "lobby"), (snap) => {
                DOM.displays.games.innerHTML = '';
                if(snap.empty) {
                    DOM.displays.games.innerHTML = '<p class="text-gray-500 p-2">Aucune partie.</p>';
                    return;
                }
                snap.forEach(d => {
                    const g = d.data();
                    const div = document.createElement('div');
                    div.className = "flex justify-between items-center p-2 border-b border-gray-700";
                    const btn = document.createElement('button');
                    btn.className = "bg-red-800 text-white px-3 py-1 rounded text-sm hover:bg-red-600";
                    if(g.hostId === myPseudoID) {
                        btn.textContent = "Supprimer";
                        btn.onclick = () => deleteGame(d.id);
                    } else {
                        btn.textContent = "Rejoindre";
                        btn.onclick = () => joinGame(d.id);
                    }
                    div.innerHTML = `<span>${g.hostName} (${g.difficulty})</span>`;
                    div.appendChild(btn);
                    DOM.displays.games.appendChild(div);
                });
            });

            const q = query(collection(db, "users"), limit(20));
            onSnapshot(q, (snap) => {
                const users = [];
                snap.forEach(d => users.push(d.data()));
                users.sort((a,b) => (b.score||0) - (a.score||0));
                DOM.displays.leaders.innerHTML = '';
                users.slice(0,10).forEach((u, i) => {
                   const div = document.createElement('div');
                   div.className = "flex justify-between text-sm p-1";
                   div.innerHTML = `<span>${i+1}. ${u.username}</span><span class="text-yellow-500">${u.score||0}</span>`;
                   DOM.displays.leaders.appendChild(div);
                });
            });
        }

        async function createGame(diff, cat) {
            if(!cat) { openCatModal(diff); return; }
            const words = WORD_CATEGORIES[cat];
            const word = words[Math.floor(Math.random() * words.length)];
            let description = null;
            if (cat === "Ships (Couples)") {
                const shipObj = SHIP_DATA_RAW.find(s => s.ship.toUpperCase() === word);
                if (shipObj) description = shipObj.personnages.join(" + ");
            }

            try {
                const gRef = await addDoc(collection(db, "games"), {
                    hostId: myPseudoID,
                    word: word,
                    category: cat,
                    wordDescription: description || null,
                    difficulty: diff,
                    guesses: [],
                    wrongs: 0,
                    status: 'playing',
                    players: [myPseudoID],
                    playerNames: { [myPseudoID]: myPseudoName },
                    scores: { [myPseudoID]: 0 },
                    turn: myPseudoID,
                    usedWords: [word]
                });
                
                await setDoc(doc(db, "lobby", gRef.id), {
                    hostId: myPseudoID,
                    hostName: myPseudoName,
                    difficulty: diff,
                    date: serverTimestamp()
                });
                joinGame(gRef.id);
            } catch(e) { console.error(e); }
        }

        // MODIFIE: Fonction unifiée pour ouvrir le modal (soit création, soit replay)
        function openCatModal(diff, isReplay = false) {
            DOM.catList.innerHTML = '';
            Object.keys(WORD_CATEGORIES).forEach(cat => {
                const btn = document.createElement('button');
                btn.textContent = cat;
                btn.className = "category-selection-button";
                btn.onclick = () => {
                    DOM.modal.classList.add('hidden');
                    if (isReplay) {
                        restartGameRound(cat); // Relance le même salon avec nouvelle catégorie
                    } else {
                        createGame(diff, cat); // Crée un nouveau salon
                    }
                };
                DOM.catList.appendChild(btn);
            });
            DOM.modal.classList.remove('hidden');
        }

        async function joinGame(id) {
            currentGameId = id;
            if(unsubGame) unsubGame();
            const gRef = doc(db, "games", id);
            try {
                const snap = await getDoc(gRef);
                if(snap.exists()) {
                    const d = snap.data();
                    if(!d.players.includes(myPseudoID)) {
                        await updateDoc(gRef, {
                            players: [...d.players, myPseudoID],
                            [`playerNames.${myPseudoID}`]: myPseudoName,
                            [`scores.${myPseudoID}`]: 0
                        });
                    }
                }
            } catch(e) {}
            DOM.lobby.classList.add('hidden');
            DOM.game.classList.remove('hidden');
            unsubGame = onSnapshot(gRef, (snap) => {
                if(!snap.exists()) { leaveGame(); alert("Partie terminée."); return; }
                renderGame(snap.data());
            });
        }

        async function deleteGame(id) {
            await deleteDoc(doc(db, "lobby", id));
            await deleteDoc(doc(db, "games", id));
        }

        function leaveGame() {
            if(unsubGame) unsubGame();
            currentGameId = null;
            DOM.game.classList.add('hidden');
            DOM.displays.status.classList.add('hidden');
            DOM.lobby.classList.remove('hidden');
        }

        function renderGame(data) {
            DOM.displays.cat.textContent = data.category;
            DOM.displays.guesses.textContent = MAX_GUESSES - data.wrongs;
            
            const isMyTurn = data.turn === myPseudoID;
            const turnName = data.playerNames[data.turn] || '?';
            DOM.displays.turn.textContent = isMyTurn ? "C'EST TON TOUR !" : `Tour de ${turnName}`;
            DOM.displays.turn.className = isMyTurn ? "text-3xl font-bold text-yellow-400 animate-pulse" : "text-2xl text-gray-500";

            // Affiche scores en temps réel sous le pendu
            DOM.displays.scoresList.innerHTML = '';
            data.players.forEach(uid => {
                const pName = data.playerNames[uid] || 'Inconnu';
                const pScore = data.scores[uid] || 0;
                const div = document.createElement('div');
                div.className = "flex justify-between text-lg p-1 border-b border-red-900/30 last:border-0";
                div.innerHTML = `<span class="${uid === myPseudoID ? 'text-yellow-300 font-bold' : 'text-gray-300'}">${pName}</span><span class="font-mono font-bold text-white">${pScore}</span>`;
                if(uid === data.turn) div.classList.add('bg-red-900/40');
                DOM.displays.scoresList.appendChild(div);
            });

            DOM.displays.word.innerHTML = '';
            data.word.split('').forEach(char => {
                const s = document.createElement('span');
                s.className = "word-display-letter mx-2 text-4xl md:text-5xl";
                if(char === ' ') { s.className="mx-3 w-6"; s.textContent = ""; }
                else { s.textContent = data.guesses.includes(char) ? char : '_'; }
                DOM.displays.word.appendChild(s);
            });

            DOM.displays.hangman.forEach((el, i) => {
                el.style.visibility = i < data.wrongs ? 'visible' : 'hidden';
            });

            DOM.displays.keyboard.innerHTML = '';
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(char => {
                const btn = document.createElement('button');
                btn.textContent = char;
                btn.className = "key w-8 h-10 rounded m-1 font-bold text-lg";
                const played = data.guesses.includes(char);
                if(played) {
                    btn.disabled = true;
                    btn.style.opacity = "0.3";
                    if(data.word.includes(char)) btn.style.backgroundColor = "green";
                } else if(!isMyTurn || data.status !== 'playing') {
                    btn.disabled = true;
                    btn.style.opacity = "0.5";
                } else {
                    btn.onclick = () => playMove(char);
                }
                DOM.displays.keyboard.appendChild(btn);
            });

            if(data.status !== 'playing') {
                DOM.displays.status.classList.remove('hidden');
                const won = data.status === 'won';
                DOM.displays.msg.textContent = won ? "VICTOIRE !" : "PERDU...";
                DOM.displays.msg.className = won ? "text-5xl font-bold text-green-500 mb-4" : "text-5xl font-bold text-red-500 mb-4";
                let resText = data.word;
                if (data.wordDescription) resText += `\n(${data.wordDescription})`;
                DOM.displays.res.textContent = resText;
                DOM.displays.img.classList.toggle('hidden', won);
                
                DOM.displays.finalScores.innerHTML = '';
                if (data.players) {
                    data.players.forEach(uid => {
                        const name = data.playerNames[uid] || 'Joueur';
                        const score = data.scores[uid] || 0;
                        const div = document.createElement('div');
                        div.className = 'flex justify-between p-2 border-b border-gray-600 text-xl';
                        div.innerHTML = `<span class="text-gray-300">${name}</span><span class="text-yellow-400 font-bold">${score}</span>`;
                        DOM.displays.finalScores.appendChild(div);
                    });
                }
                const isHost = data.hostId === myPseudoID;
                DOM.btns.replay.classList.toggle('hidden', !isHost);
                // MODIFIE: Gère le replay selon la difficulté
                DOM.btns.replay.onclick = () => replay(data);
            } else {
                DOM.displays.status.classList.add('hidden');
            }
        }

        async function playMove(char) {
            if(!currentGameId) return;
            const ref = doc(db, "games", currentGameId);
            await runTransaction(db, async (t) => {
                const snap = await t.get(ref);
                const d = snap.data();
                if(d.status !== 'playing' || d.turn !== myPseudoID || d.guesses.includes(char)) return;
                const nextGuesses = [...d.guesses, char];
                let nextWrongs = d.wrongs;
                let hit = d.word.includes(char);
                if(!hit) nextWrongs++;
                const allFound = d.word.replace(/ /g,'').split('').every(c => nextGuesses.includes(c));
                let nextStatus = 'playing';
                if(allFound) nextStatus = 'won';
                if(nextWrongs >= MAX_GUESSES) nextStatus = 'lost';
                let nextTurn = d.turn;
                if(!hit && nextStatus === 'playing') {
                    const idx = d.players.indexOf(myPseudoID);
                    nextTurn = d.players[(idx + 1) % d.players.length];
                }
                if(nextStatus === 'won') {
                    t.update(doc(db, "users", myPseudoID), { score: increment(1) });
                    // Increment local game score too
                    const newScores = {...d.scores};
                    newScores[myPseudoID] = (newScores[myPseudoID] || 0) + 1;
                    t.update(ref, { scores: newScores });
                }
                t.update(ref, { guesses: nextGuesses, wrongs: nextWrongs, status: nextStatus, turn: nextTurn });
            });
        }

        // MODIFIE: Logique de replay qui ouvre le modal si Facile
        function replay(oldData) {
            if (oldData.difficulty === 'facile') {
                openCatModal('facile', true); // true = mode replay
            } else {
                // En difficile, on relance direct dans la même catégorie (ou aléatoire selon logique précédente)
                restartGameRound(oldData.category);
            }
        }

        // NOUVEAU: Fonction dédiée pour relancer la manche dans le même salon
        async function restartGameRound(category) {
            // Récupère les infos actuelles pour la rotation
            const gameRef = doc(db, "games", currentGameId);
            const snap = await getDoc(gameRef);
            if (!snap.exists()) return;
            const oldData = snap.data();

            const words = WORD_CATEGORIES[category];
            const newWord = words[Math.floor(Math.random() * words.length)];
            const nextP = oldData.players[(oldData.players.indexOf(oldData.turn) + 1) % oldData.players.length];
            
            let description = null;
            if (category === "Ships (Couples)") {
                const shipObj = SHIP_DATA_RAW.find(s => s.ship.toUpperCase() === newWord);
                if (shipObj) description = shipObj.personnages.join(" + ");
            }
            
            await updateDoc(gameRef, {
                word: newWord,
                category: category,
                wordDescription: description || null,
                guesses: [],
                wrongs: 0,
                status: 'playing',
                turn: nextP
            });
        }

        DOM.btns.login.onclick = login;
        DOM.btns.register.onclick = register;
        DOM.btns.easy.onclick = () => createGame('facile');
        DOM.btns.hard.onclick = () => createGame('difficile');
        DOM.btns.leave.onclick = leaveGame;
        DOM.btns.backLobby.onclick = leaveGame;
        DOM.btns.logout.onclick = () => location.reload();
        DOM.btns.cancelCat.onclick = () => DOM.modal.classList.add('hidden');
        
        // Touches Physiques (RESTORED)
        document.addEventListener('keydown', (e) => {
            if(currentGameId && !DOM.game.classList.contains('hidden') && DOM.displays.status.classList.contains('hidden')) {
                const char = e.key.toUpperCase();
                if(/^[A-Z]$/.test(char)) {
                     playMove(char);
                }
            }
        });

        const bgImg = new Image();
        bgImg.onload = () => document.body.classList.add('bg-loaded');
        bgImg.src = './image/backround.jpg';

        initNetwork();
    </script>
</body>
</html>
