            background-attachment: fixed;
            background-color: #000;

        @keyframes pulse-text-glow {
            0%, 100% { text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000, 0 0 15px #ff4d4d; }
            50% { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff4d4d, 0 0 30px #ff4d4d; }
        }
        @keyframes pulse-border-glow {
            0%, 100% { border-color: #ff0000; box-shadow: 0 0 20px #ff0000; }
            50% { border-color: #ff4d4d; box-shadow: 0 0 30px #ff4d4d, 0 0 10px #ff0000; }
        }
        .title-font {
            font-family: 'Cinzel Decorative', cursive;
            color: #ff0000;
            text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000, 0 0 15px #ff4d4d;
            animation: pulse-text-glow 2.5s ease-in-out infinite;
        }
        .game-container, .lobby-container, .modal-container {
            backdrop-filter: blur(5px);
            background-color: rgba(30, 0, 0, 0.6);
            border: 2px solid #ff0000;
            box-shadow: 0 0 20px #ff0000;
            animation: pulse-border-glow 2.5s ease-in-out infinite;
        }
        .word-display-letter {
            font-family: 'Special Elite', monospace;
            font-weight: bold;
            color: #ffd700;
            border-bottom: 4px solid #ffd700;
            width: 1.5em;
            height: 2em;
            line-height: 2em;
        }
        .word-display-letter.space {
            border-bottom: none;
        }
        .key {
            background-color: rgba(50, 0, 10, 0.8);
            border: 1px solid #ff0000;
            color: #fce8f3;
            transition: all 0.2s ease;
            font-family: 'Special Elite', monospace;
            font-size: 1.1rem;
        }
        .key:hover:not(:disabled) {
            background-color: #ff0000;
            color: #000;
            transform: scale(1.1);
        }
        .key:disabled {
            background-color: #333;
            color: #666;
            opacity: 0.5;
            cursor: not-allowed;
        }
        .hangman-part {
            stroke: #ffd700;
            stroke-width: 4;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            visibility: hidden;
            transition: visibility 0s;
        }
        .gallows-part {
            stroke: #cc0000;
            stroke-width: 7;
            fill: none;
        }
        .game-status {
            background-color: rgba(0, 0, 0, 0.9);
            border: 2px solid #ffd700;
        }
        .replay-button, .lobby-button {
            background-color: #ffd700;
            color: #1a0000;
            font-weight: bold;
            transition: all 0.2s ease;
            font-family: 'Special Elite', monospace;
        }
        .replay-button:hover, .lobby-button:hover {
            background-color: #ff0000;
            color: #fff;
            box-shadow: 0 0 15px #ff0000;
        }
        .difficulty-button {
            background-color: #b8860b;
            color: #1a0000;
            font-size: 1.1rem; 
            padding-top: 0.5rem; 
            padding-bottom: 0.5rem;
        }
        .difficulty-button:disabled {
            background-color: #555;
            opacity: 0.7;
        }
        .difficulty-button:hover:not(:disabled) {
             background-color: #ffd700;
             color: #000;
        }
        .difficulty-button.difficile {
            background-color: #cc0000;
            color: #fff;
        }
        .difficulty-button.difficile:hover:not(:disabled) {
            background-color: #ff4d4d;
            color: #000;
        }
        .lobby-game-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ff0000;
            border-radius: 8px;
            margin-top: 1rem;
            padding: 0.5rem;
            background-color: rgba(0, 0, 0, 0.3);
        }
        .lobby-game-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0.5rem;
            border-bottom: 1px dashed #555;
        }
        .lobby-game-item:last-child {
            border-bottom: none;
        }
        .lobby-game-item button {
            background-color: #cc0000;
            color: #fff;
            padding: 0.25rem 0.75rem;
            border-radius: 5px;
            font-size: 0.9rem;
            margin-left: 4px;
        }
        .lobby-game-item button:hover {
            background-color: #ff0000;
        }
        .lobby-game-item button:disabled {
             background-color: #555;
             opacity: 0.7;
        }
        .delete-button {
            background-color: #800000 !important;
        }
        .delete-button:hover {
             background-color: #cc0000 !important;
        }
        .lobby-separator {
            color: #ffd700;
            font-weight: bold;
        }
        .lobby-error-message {
            color: #ff0000;
            text-shadow: 0 0 5px #ff0000;
            min-height: 1.5rem;
        }
        .user-id-display {
            color: #888;
            font-size: 0.8rem;
        }
        #scores-list .flex {
            border-bottom: 1px dashed #444;
        }

            border-bottom: none;
        }
        .category-modal {
            background-color: rgba(0, 0, 0, 0.9);
            border: 2px solid #ffd700;
        }
        #category-list-container {
            max-height: 60vh;
            overflow-y: auto;

            background-color: #ff0000;
            color: #000;

        }

            background-color: #555;
            color: #fff;
        }

            background-color: #888;
            color: #000;
        }

                lobbyContainer: document.getElementById('lobby-container'),
                createGameFacileBtn: document.getElementById('create-game-facile-btn'),
                createGameDifficileBtn: document.getElementById('create-game-difficile-btn'),
                activeGamesList: document.getElementById('active-games-list'),
                noGamesMessage: document.getElementById('no-games-message'),
                lobbyError: document.getElementById('lobby-error'),
                userIdDisplay: document.getElementById('user-id-display'),
                gameContainer: document.getElementById('game-container'),
                leaveGameBtn: document.getElementById('leave-game-btn'),
                categoryP: document.getElementById('category-p'),
                categoryDisplay: document.getElementById('word-category'),
                turnIndicator: document.getElementById('turn-indicator'),
                guessesLeftSpan: document.getElementById('guesses-left'),
                hangmanParts: document.querySelectorAll('.hangman-part'),
                wordDisplay: document.getElementById('word-display'),
                keyboard: document.getElementById('keyboard'),
                scoresList: document.getElementById('scores-list'), 
                gameStatus: document.getElementById('game-status'),
                statusMessage: document.getElementById('status-message'),
                correctWordDisplay: document.getElementById('correct-word'),
                finalScoresList: document.getElementById('final-scores-list'), 
                replayGameButton: document.getElementById('replay-game-button'),
                lobbyReturnButton: document.getElementById('lobby-return-button'),
                categoryModal: document.getElementById('category-selection-modal'),
                categoryListContainer: document.getElementById('category-list-container'),
                categoryModalCancelBtn: document.getElementById('category-modal-cancel-btn')
            };

            try {
                firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                db = firebase.firestore();
                
                DOM.userIdDisplay.textContent = "Initialisation terminée. Connexion...";
                initializeAuth();
                addEventListeners();
            } catch (e) {
                console.error("Erreur d'initialisation Firebase:", e);
                DOM.userIdDisplay.textContent = "Erreur critique.";
                DOM.lobbyError.textContent = "Impossible d'initialiser Firebase.";
            }

            function initializeAuth() {
                auth.onAuthStateChanged((user) => {
                    if (user) {
                        currentUserId = user.uid;
                        currentHostName = `Joueur_${currentUserId.substring(0, 6)}`;
                        DOM.userIdDisplay.textContent = `Connecté en tant que: ${currentHostName}`;
                        DOM.lobbyError.textContent = "";
                        DOM.createGameFacileBtn.disabled = false;
                        DOM.createGameDifficileBtn.disabled = false;
                        listenToLobby();
                    } else {
                        currentUserId = null;
                        currentHostName = null;
                        DOM.userIdDisplay.textContent = "Déconnecté";
                        DOM.createGameFacileBtn.disabled = true;
                        DOM.createGameDifficileBtn.disabled = true;
                        if (unsubscribeLobbyListener) unsubscribeLobbyListener();
                    }
                });

                (async function signIn() {
                    try {
                        DOM.userIdDisplay.textContent = "Connexion en cours...";
                        await auth.signInAnonymously();
                    } catch (error) {
                        console.error("Erreur d'authentification:", error);
                        DOM.lobbyError.textContent = "Échec connexion.";
                        DOM.userIdDisplay.textContent = "Échec de la connexion";
                    }
                })();
            }

            function addEventListeners() {
                DOM.createGameFacileBtn.addEventListener('click', () => showCategoryModal('create'));
                DOM.createGameDifficileBtn.addEventListener('click', () => createGame('difficile', null));
                DOM.lobbyReturnButton.addEventListener('click', leaveGame);
                DOM.replayGameButton.addEventListener('click', promptForReplay);
                DOM.leaveGameBtn.addEventListener('click', leaveGame);
                DOM.keyboard.addEventListener('click', handleKeyboardClick);
                document.addEventListener('keydown', handlePhysicalKey);
                DOM.categoryModalCancelBtn.addEventListener('click', hideCategoryModal); 
            }

            function showCategoryModal(mode) {
                DOM.categoryListContainer.innerHTML = '';
                const allCategories = Object.keys(WORD_CATEGORIES);
                
                allCategories.forEach(categoryName => {
                    const btn = document.createElement('button');
                    btn.textContent = categoryName;
                    btn.classList.add('category-selection-button');
                    btn.onclick = () => {
                        hideCategoryModal();
                        if (mode === 'create') {
                            createGame('facile', categoryName);
                        } else if (mode === 'replay') {
                            handleReplay(categoryName);
                        }
                    };
                    DOM.categoryListContainer.appendChild(btn);
                });
                
                DOM.categoryModal.classList.remove('hidden');
                
                if (mode === 'create') {
                    DOM.lobbyContainer.classList.add('hidden');
                } else {
                    DOM.gameStatus.classList.add('hidden');
                }
            }

            function hideCategoryModal() {
                DOM.categoryModal.classList.add('hidden');
                if (!currentGameId) {
                    DOM.lobbyContainer.classList.remove('hidden');
                } else {
                    DOM.gameStatus.classList.remove('hidden');
                }
            }

            async function deleteGameFromLobby(gameId) {
                if (!gameId) return;
                try {
                    await db.collection("lobby").doc(gameId).delete();
                    await db.collection("games").doc(gameId).delete();
                } catch (error) {
                    console.error("Erreur suppression:", error);
                }
            }
            
            function listenToLobby() {
                if (unsubscribeLobbyListener) unsubscribeLobbyListener();
                
                unsubscribeLobbyListener = db.collection("lobby").onSnapshot((snapshot) => {
                    DOM.activeGamesList.innerHTML = '';
                    if (snapshot.empty) {
                        DOM.activeGamesList.appendChild(DOM.noGamesMessage.cloneNode(true));
                    } else {
                        snapshot.forEach((docSnap) => {
                            const game = docSnap.data();
                            const gameId = docSnap.id;
                            
                            const item = document.createElement('div');
                            item.classList.add('lobby-game-item');
                            
                            const text = document.createElement('span');
                            const difficultyText = game.difficulty === 'facile' ? 'Facile' : 'Difficile';
                            text.textContent = `${game.hostName} (${difficultyText})`;
                            item.appendChild(text);

                            const buttonContainer = document.createElement('div');
                            const joinBtn = document.createElement('button');
                            joinBtn.textContent = "Rejoindre";

                            if (game.hostId === currentUserId) {
                                joinBtn.disabled = true;
                                joinBtn.textContent = "Votre partie";
                                const deleteBtn = document.createElement('button');
                                deleteBtn.textContent = "Supprimer";
                                deleteBtn.classList.add('delete-button');
                                deleteBtn.onclick = (e) => {
                                    e.stopPropagation();
                                    deleteGameFromLobby(gameId);
                                };
                                buttonContainer.appendChild(joinBtn);
                                buttonContainer.appendChild(deleteBtn);
                            } else {
                                joinBtn.onclick = () => joinGame(gameId);
                                buttonContainer.appendChild(joinBtn);
                            }
                            item.appendChild(buttonContainer);
                            DOM.activeGamesList.appendChild(item);
                        });
                    }
                }, (error) => {
                    console.error("Erreur lobby:", error);
                });
            }

            async function createGame(difficulty, categoryName) {
                if (!currentUserId || !difficulty) return;
                DOM.createGameFacileBtn.disabled = true;
                DOM.createGameDifficileBtn.disabled = true;
                DOM.lobbyError.textContent = "Création...";

                try {
                    const newWordData = getNewWord(categoryName, []);
                    if (!newWordData || !newWordData.word) {
                        throw new Error("Erreur récupération mot.");
                    }
                    
                    const wordToUse = newWordData.word.toUpperCase();
                    
                    const gameDocRef = await db.collection("games").add({
                        hostId: currentUserId,
                        word: wordToUse,
                        category: newWordData.category,
                        // Ajout de la description du mot (pour les Ships)
                        wordDescription: newWordData.description || null, 
                        difficulty: difficulty,
                        guessedLetters: [],
                        wrongGuesses: 0,
                        status: "playing",
                        playerList: [currentUserId],
                        playerScores: { [currentUserId]: 0 },
                        currentPlayerTurn: currentUserId,
                        starterIndex: 0,
                        usedWords: [wordToUse]
                    });
                    
                    const gameId = gameDocRef.id;

                    await db.collection("lobby").doc(gameId).set({
                        hostId: currentUserId,
                        hostName: currentHostName,
                        difficulty: difficulty,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    currentGameId = gameId;
                    const initialGameState = (await gameDocRef.get()).data();
                    
                    DOM.lobbyContainer.classList.add('hidden');
                    DOM.gameContainer.classList.remove('hidden');
                    generateKeyboard();
                    updateUI(initialGameState);
                    attachGameListener(gameId);
                    
                } catch (error) {
                    console.error("Erreur création:", error);
                    DOM.lobbyError.textContent = "Erreur création.";
                    DOM.createGameFacileBtn.disabled = false;
                    DOM.createGameDifficileBtn.disabled = false;
                    DOM.lobbyContainer.classList.remove('hidden');
                }
            }
            
            function attachGameListener(gameId) {
                if (unsubscribeGameListener) unsubscribeGameListener();
                
                unsubscribeGameListener = db.collection("games").doc(gameId).onSnapshot((docSnap) => {
                    if (!docSnap.exists) {
                        DOM.lobbyError.textContent = "Partie terminée.";
                        leaveGame();
                        return;
                    }
                    updateUI(docSnap.data());
                }, (error) => {
                    console.error("Erreur écoute:", error);
                    leaveGame();
                });
            }

            async function joinGame(gameId) {
                if (unsubscribeGameListener) unsubscribeGameListener();
                if (unsubscribeLobbyListener) unsubscribeLobbyListener();

                currentGameId = gameId;
                const gameDocRef = db.collection("games").doc(gameId);

                try {
                    await db.runTransaction(async (transaction) => {
                        const gameDocSnap = await transaction.get(gameDocRef);
                        if (!gameDocSnap.exists) throw new Error("Partie introuvable.");
                        
                        const gameData = gameDocSnap.data();
                        let playerList = gameData.playerList || [];
                        let playerScores = gameData.playerScores || {}; 
                        
                        if (!playerList.includes(currentUserId)) {
                            playerList.push(currentUserId);
                        }
                        if (!playerScores.hasOwnProperty(currentUserId)) { 
                            playerScores[currentUserId] = 0; 
                        }

                        transaction.update(gameDocRef, { 
                            playerList: playerList,
                            playerScores: playerScores 
                        });
                    });
                    
                    const initialGameState = (await gameDocRef.get()).data();

                    DOM.lobbyContainer.classList.add('hidden');
                    DOM.gameContainer.classList.remove('hidden');
                    generateKeyboard();
                    updateUI(initialGameState);
                    attachGameListener(gameId);

                } catch (error) {
                    console.error("Erreur join:", error);
                    leaveGame();
                }
            }

            async function leaveGame() {
                if (unsubscribeGameListener) {
                    unsubscribeGameListener();
                    unsubscribeGameListener = null;
                }

                if (currentGameId && currentUserId) {
                    try {
                        const gameDocRef = db.collection("games").doc(currentGameId);
                        
                        await db.runTransaction(async (transaction) => {
                            const gameDoc = await transaction.get(gameDocRef);
                            if (!gameDoc.exists) return;
                            
                            const gameData = gameDoc.data();
                            
                            if (gameData.hostId === currentUserId) {
                                transaction.delete(db.collection("lobby").doc(currentGameId));
                                transaction.delete(gameDocRef);
                            } else {
                                const newPlayerList = gameData.playerList.filter(uid => uid !== currentUserId);
                                let newCurrentTurnUID = gameData.currentPlayerTurn;

                                if (gameData.currentPlayerTurn === currentUserId && newPlayerList.length > 0) {
                                    const leavingPlayerIndex = gameData.playerList.indexOf(currentUserId);
                                    const nextPlayerIndex = leavingPlayerIndex % newPlayerList.length;
                                    newCurrentTurnUID = newPlayerList[nextPlayerIndex];
                                }
                                
                                transaction.update(gameDocRef, {
                                    playerList: newPlayerList,
                                    currentPlayerTurn: newCurrentTurnUID
                                });
                            }
                        });

                    } catch (e) {
                        console.warn("Erreur leave:", e.message);
                    }
                }

                currentGameId = null;
                DOM.gameContainer.classList.add('hidden');
                DOM.lobbyContainer.classList.remove('hidden');
                DOM.gameStatus.classList.add('hidden');
                DOM.lobbyError.textContent = "";
                DOM.createGameFacileBtn.disabled = false;
                DOM.createGameDifficileBtn.disabled = false;
                listenToLobby();
            }

            async function promptForReplay() {
                if (!currentGameId || !currentUserId) return;
                
                const gameDocRef = db.collection("games").doc(currentGameId);
                const gameDoc = await gameDocRef.get();
                if (!gameDoc.exists) return;
                const gameState = gameDoc.data();

                if (gameState.hostId !== currentUserId) {
                    DOM.statusMessage.textContent = "Seul l'hôte peut recommencer.";
                    DOM.replayGameButton.style.display = 'none';
                    return;
                }

                if (gameState.difficulty === 'facile') {
                    showCategoryModal('replay');
                } else {
                    handleReplay(null);
                }
            }

            async function handleReplay(categoryName) {
                if (!currentGameId || !currentUserId) return;

                const gameDocRef = db.collection("games").doc(currentGameId);
                const gameDoc = await gameDocRef.get();
                
                if (!gameDoc.exists) return;
                const gameState = gameDoc.data();

                const oldUsedWords = gameState.usedWords || [];
                
                const newWordData = getNewWord(categoryName, oldUsedWords); 
                if (!newWordData || !newWordData.word) return;

                const wordToUse = newWordData.word.toUpperCase();
                let newUsedWordsList;
                
                if (newWordData.needsReset) {
                    newUsedWordsList = [wordToUse]; 
                } else {
                    newUsedWordsList = [...oldUsedWords, wordToUse];
                }

                const playerList = gameState.playerList;
                const oldStarterIndex = gameState.starterIndex || 0;
                const newStarterIndex = (oldStarterIndex + 1) % playerList.length;
                const newStarterUID = playerList[newStarterIndex];
                const newPlayerScores = gameState.playerScores || {}; 

                playerList.forEach(uid => {
                    if (!newPlayerScores.hasOwnProperty(uid)) {
                        newPlayerScores[uid] = 0;
                    }
                });

                try {
                    await gameDocRef.update({
                        word: wordToUse,
                        category: newWordData.category,
                        // Mise à jour de la description pour la nouvelle partie
                        wordDescription: newWordData.description || null, 
                        guessedLetters: [],
                        wrongGuesses: 0,
                        status: "playing",
                        playerScores: newPlayerScores,
                        starterIndex: newStarterIndex,
                        currentPlayerTurn: newStarterUID,
                        usedWords: newUsedWordsList
                    });
                    
                    await db.collection("lobby").doc(currentGameId).set({
                        hostId: currentUserId,
                        hostName: currentHostName,
                        difficulty: gameState.difficulty, 
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                } catch (error) {
                    console.error("Erreur replay:", error);
                }
            }

            async function handleGuess(letter) {
                if (!currentGameId || !currentUserId) return;

                const normalizedLetter = letter.toUpperCase();
                const gameDocRef = db.collection("games").doc(currentGameId);

                try {
                    await db.runTransaction(async (transaction) => {
                        const gameDocSnap = await transaction.get(gameDocRef);
                        if (!gameDocSnap.exists) throw "Partie introuvable.";
                        
                        const gameState = gameDocSnap.data();
                        
                        if (gameState.currentPlayerTurn !== currentUserId) return;
                        
                        if (!gameState.word || gameState.guessedLetters.includes(normalizedLetter) || gameState.status !== 'playing') {
                            return;
                        }

                        const newGuessedLetters = [...gameState.guessedLetters, normalizedLetter];
                        let newWrongGuesses = gameState.wrongGuesses;
                        let newStatus = gameState.status;
                        const newScores = JSON.parse(JSON.stringify(gameState.playerScores || {}));
                        
                        const isCorrectGuess = gameState.word.includes(normalizedLetter);
                        
                        if (!isCorrectGuess) {
                            newWrongGuesses++;
                        }
                        
                        const wordToGuess = gameState.word.replace(/ /g, '');
                        const allLettersGuessed = wordToGuess.split('').every(l => newGuessedLetters.includes(l));
                        
                        if (allLettersGuessed) {
                            newStatus = 'won';
                            const currentScore = newScores[currentUserId] || 0;
                            newScores[currentUserId] = currentScore + 1; 
                        } else if (newWrongGuesses >= MAX_GUESSES) {
                            newStatus = 'lost';
                        }
                        
                        let nextPlayerUID = gameState.currentPlayerTurn;
                        
                        if (newStatus === 'playing' && !isCorrectGuess) {
                            const playerList = gameState.playerList;
                            if (playerList.length > 0) {
                                const currentPlayerIndex = playerList.indexOf(currentUserId);
                                const nextPlayerIndex = (currentPlayerIndex + 1) % playerList.length;
                                nextPlayerUID = playerList[nextPlayerIndex];
                            }
                        }

                        transaction.update(gameDocRef, {
                            guessedLetters: newGuessedLetters,
                            wrongGuesses: newWrongGuesses,
                            status: newStatus,
                            currentPlayerTurn: nextPlayerUID,
                            playerScores: newScores 
                        });
                    });
                } catch (error) {
                    console.error("Erreur guess:", error);
                }
            }

            function updateUI(gameState) {
                if (!gameState || !gameState.word || !gameState.category) {
                    DOM.categoryP.classList.remove('hidden'); 
                    DOM.categoryDisplay.textContent = "Chargement...";
                    DOM.wordDisplay.innerHTML = '<div class="text-2xl text-yellow-300">Chargement du mot...</div>';
                    return;
                }
                
                if (gameState.difficulty === 'facile') {
                    DOM.categoryP.classList.remove('hidden');
                    DOM.categoryDisplay.textContent = gameState.category;
                } else {
                    DOM.categoryP.classList.add('hidden');
                }

                const isMyTurn = (gameState.currentPlayerTurn === currentUserId);
                const gameIsOver = (gameState.status !== 'playing');

                if (gameIsOver) {
                    DOM.turnIndicator.textContent = "";
                } else if (isMyTurn) {
                    DOM.turnIndicator.textContent = "C'est votre tour !";
                    DOM.turnIndicator.style.color = "#ffd700";
                } else {
                    const turnPlayerId = gameState.currentPlayerTurn;
                    let turnPlayerHostName = "Autre joueur";
                    if(turnPlayerId) {
                         turnPlayerHostName = `Joueur_${turnPlayerId.substring(0, 6)}`;
                    }
                    DOM.turnIndicator.textContent = `Au tour de ${turnPlayerHostName}...`;
                    DOM.turnIndicator.style.color = "#aaa";
                }

                DOM.guessesLeftSpan.textContent = MAX_GUESSES - gameState.wrongGuesses;
                displayWord(gameState.word, gameState.guessedLetters);
                updateKeyboard(gameState.guessedLetters, gameState.status, isMyTurn);
                updateHangman(gameState.wrongGuesses);
                updateScoreboard(gameState.playerList, gameState.playerScores, gameState.currentPlayerTurn); 
                checkEndGame(gameState);
            }

            function updateScoreboard(playerList, playerScores, currentPlayerTurn) {
                DOM.scoresList.innerHTML = ''; 
                if (!playerList || !playerScores) return;

                playerList.forEach(uid => {
                    const hostName = `Joueur_${uid.substring(0, 6)}`;
                    const score = playerScores[uid] || 0;
                    
                    const scoreElement = document.createElement('div');
                    scoreElement.classList.add('flex', 'justify-between', 'p-1');
                    
                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = `${hostName}:`;
                    
                    const scoreSpan = document.createElement('span');
                    scoreSpan.textContent = score;
                    scoreSpan.classList.add('font-bold');

                    if (uid === currentPlayerTurn) {
                        nameSpan.classList.add('text-yellow-300');
                        scoreElement.classList.add('bg-gray-700', 'bg-opacity-50', 'rounded');
                    }
                    
                    scoreElement.appendChild(nameSpan);
                    scoreElement.appendChild(scoreSpan);
                    DOM.scoresList.appendChild(scoreElement);
                });
            }

            function getNewWord(categoryName = null, usedWords = []) {
                let categoryToPickFrom = categoryName;
                
                if (!categoryToPickFrom) {
                    const allCategories = Object.keys(WORD_CATEGORIES);
                    categoryToPickFrom = allCategories[Math.floor(Math.random() * allCategories.length)];
                }
                
                const wordList = WORD_CATEGORIES[categoryToPickFrom];
                if (!wordList || wordList.length === 0) {
                    return getNewWord(null, usedWords);
                }

                let needsReset = false;
                let availableWords = wordList.filter(word => !usedWords.includes(word.toUpperCase()));
                
                if (availableWords.length === 0) {
                    availableWords = wordList;
                    needsReset = true;
                }
                
                const word = availableWords[Math.floor(Math.random() * availableWords.length)];
                
                // LOGIQUE SHIP: Trouver la description si c'est un ship
                let description = null;
                if (categoryToPickFrom === "Ships (Couples)") {
                    const shipObj = SHIP_DATA_RAW.find(s => s.ship.toUpperCase() === word);
                    if (shipObj) {
                        description = shipObj.personnages.join(" + ");
                    }
                }

                return { word: word, category: categoryToPickFrom, description: description, needsReset: needsReset };
            }

            function displayWord(currentWord, guessedLetters) {
                DOM.wordDisplay.innerHTML = '';
                const words = currentWord.split(' ');
                
                words.forEach((word, index) => {
                    const wordContainer = document.createElement('div');
                    wordContainer.classList.add('flex', 'flex-wrap', 'justify-center', 'gap-2', 'md:gap-3');
                    
                    if (index > 0) {
                        const spaceElement = document.createElement('div');
                        spaceElement.classList.add('w-4', 'md:w-8');
                        DOM.wordDisplay.appendChild(spaceElement);
                    }
                    
                    word.split('').forEach(letter => {
                        const letterElement = document.createElement('div');
                        letterElement.classList.add('text-center', 'text-2xl', 'md:text-4xl', 'word-display-letter');
                        
                        if (guessedLetters.includes(letter)) {
                            letterElement.textContent = letter;
                        } else {
                            letterElement.textContent = '_';
                        }
                        wordContainer.appendChild(letterElement);
                    });
                    DOM.wordDisplay.appendChild(wordContainer);
                });
            }

            function generateKeyboard() {
                DOM.keyboard.innerHTML = '';
                const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                
                alphabet.split('').forEach(letter => {
                    const keyButton = document.createElement('button');
                    keyButton.textContent = letter;
                    keyButton.classList.add('key', 'font-bold', 'text-lg', 'w-8', 'h-10', 'md:w-12', 'md:h-12', 'rounded-md', 'm-1');
                    keyButton.dataset.letter = letter;
                    DOM.keyboard.appendChild(keyButton);
                });
            }

            function updateKeyboard(guessedLetters, gameStatus, isMyTurn) {
                const gameIsOver = (gameStatus !== 'playing');
                DOM.keyboard.querySelectorAll('button').forEach(keyButton => {
                    keyButton.disabled = gameIsOver || !isMyTurn || guessedLetters.includes(keyButton.dataset.letter);
                });
            }
            
            function updateHangman(wrongGuesses) {
                DOM.hangmanParts.forEach(part => part.style.visibility = 'hidden');
                for (let i = 0; i < wrongGuesses; i++) {
                    if (i < DOM.hangmanParts.length) {
                        DOM.hangmanParts[i].style.visibility = 'visible';
                    }
                }
            }

            async function checkEndGame(gameState) {
                if (gameState.status === 'playing') {
                    DOM.gameStatus.classList.add('hidden');
                    return;
                }
                
                if (gameState.hostId === currentUserId) {
                    try {
                        await db.collection("lobby").doc(currentGameId).delete();
                    } catch(e) {}
                }
                
                DOM.finalScoresList.innerHTML = '';
                const { playerList, playerScores } = gameState;
                if (playerList && playerScores) {
                     playerList.forEach(uid => {
                        const hostName = `Joueur_${uid.substring(0, 6)}`;
                        const score = playerScores[uid] || 0;
                        const scoreElement = document.createElement('div');
                        scoreElement.classList.add('flex', 'justify-between', 'p-1');
                        const nameSpan = document.createElement('span');
                        nameSpan.textContent = `${hostName}:`;
                        const scoreSpan = document.createElement('span');
                        scoreSpan.textContent = score;
                        scoreSpan.classList.add('font-bold');
                        scoreElement.appendChild(nameSpan);
                        scoreElement.appendChild(scoreSpan);
                        DOM.finalScoresList.appendChild(scoreElement);
                    });
                }
                
                DOM.gameStatus.classList.remove('hidden');
                
                // Préparation du texte du mot correct + description si présente
                let wordText = gameState.word;
                if (gameState.wordDescription) {
                    wordText += `\n(${gameState.wordDescription})`;
                }

                if (gameState.status === 'won') {
                    DOM.statusMessage.textContent = 'Gagné ! Tu es sauvé !';
                    DOM.statusMessage.classList.remove('text-red-500');
                    DOM.statusMessage.classList.add('text-green-500');
                    DOM.correctWordDisplay.textContent = `Tu as deviné : ${wordText}`;
                } else if (gameState.status === 'lost') {
                    DOM.statusMessage.textContent = 'Perdu ! Direction l\'Extermination !';
                    DOM.statusMessage.classList.remove('text-green-500');
                    DOM.statusMessage.classList.add('text-red-500');
                    DOM.correctWordDisplay.textContent = `Le mot était : ${wordText}`;
                }
                DOM.replayGameButton.style.display = (gameState.hostId === currentUserId) ? 'block' : 'none';
            }

            function handleKeyboardClick(e) {
                if (e.target.tagName === 'BUTTON' && e.target.dataset.letter) {
                    if (!e.target.disabled) handleGuess(e.target.dataset.letter);
                }
            }

            function handlePhysicalKey(e) {
                if (DOM.gameContainer.classList.contains('hidden') || !DOM.gameStatus.classList.contains('hidden')) return; 
                if (e.key.length === 1 && e.key.match(/[a-z]/i)) {
                    const letter = e.key.toUpperCase();
                    const keyButton = DOM.keyboard.querySelector(`[data-letter="${letter}"]`);
                    if (keyButton && !keyButton.disabled) handleGuess(letter);
                }
            }

        });
