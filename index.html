    <style>
        /* --- STYLE DU JEU --- */
        body {
            font-family: 'Special Elite', monospace;
            color: #fce8f3;
            background-color: #000;
            /* Fond de repli si l'image ne charge pas */
            background-image: radial-gradient(circle, #2b0000 0%, #000000 100%); 
            min-height: 100vh;
        }
        
        /* Tentative de charger votre image de fond si elle est dans le dossier */
        body.bg-loaded {
            background-image: url('./image/backround.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Animations */
        @keyframes pulse-text-glow {
            0%, 100% { text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000, 0 0 15px #ff4d4d; }
            50% { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff4d4d, 0 0 30px #ff4d4d; }
        }
        @keyframes pulse-border-glow {
            0%, 100% { border-color: #ff0000; box-shadow: 0 0 20px #ff0000; }
            50% { border-color: #ff4d4d; box-shadow: 0 0 30px #ff4d4d, 0 0 10px #ff0000; }
        }

        .title-font {
            font-family: 'Cinzel Decorative', cursive;
            color: #ff0000;
            text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000, 0 0 15px #ff4d4d;
            animation: pulse-text-glow 2.5s ease-in-out infinite;
        }
        .game-container, .lobby-container, .modal-container, .auth-container {
            backdrop-filter: blur(5px);
            background-color: rgba(30, 0, 0, 0.6);
            border: 2px solid #ff0000;
            box-shadow: 0 0 20px #ff0000;
            animation: pulse-border-glow 2.5s ease-in-out infinite;
        }
        
        /* Éléments du jeu */
        .word-display-letter {
            font-family: 'Special Elite', monospace;
            font-weight: bold;
            color: #ffd700;
            border-bottom: 4px solid #ffd700;
            width: 1.5em;
            height: 2em;
            line-height: 2em;
        }
        .key {
            background-color: rgba(50, 0, 10, 0.8);
            border: 1px solid #ff0000;
            color: #fce8f3;
            transition: all 0.2s ease;
        }
        .key:hover:not(:disabled) {
            background-color: #ff0000;
            color: #000;
            transform: scale(1.1);
        }
        .key:disabled {
            background-color: #333;
            color: #666;
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .hangman-part { stroke: #ffd700; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; visibility: hidden; }
        .gallows-part { stroke: #cc0000; stroke-width: 7; fill: none; }
        
        .lobby-button {
            background-color: #ffd700;
            color: #1a0000;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .lobby-button:hover {
            background-color: #ff0000;
            color: #fff;
            box-shadow: 0 0 15px #ff0000;
        }
        .auth-input {
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid #ff0000;
            color: #ffd700;
            padding: 0.75rem;
            border-radius: 0.5rem;
            width: 100%;
            margin-bottom: 1rem;
            outline: none;
        }
        .difficulty-button { background-color: #b8860b; color: #1a0000; }
        .difficulty-button.difficile { background-color: #cc0000; color: #fff; }
        
        .category-selection-button {
            background-color: rgba(50, 0, 10, 0.8);
            border: 1px solid #ff0000;
            color: #fce8f3;
            width: 100%; margin-bottom: 0.5rem; padding: 0.75rem;
        }
        .category-selection-button:hover { background-color: #ff0000; color: #000; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a0000; }
        ::-webkit-scrollbar-thumb { background: #800000; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff0000; }

        async function initNetwork() {

                DOM.loader.classList.remove('hidden');
                await signInAnonymously(auth);
                DOM.loader.classList.add('hidden');

        function sanitize(str) { return str.toLowerCase().trim().replace(/[^a-z0-9]/g, ''); }

            const pseudo = DOM.authPseudo.value.trim();
            const pass = DOM.authPass.value;
            if(pseudo.length < 3 || pass.length < 4) { DOM.authErr.textContent = "Pseudo (3+) ou MDP (4+) trop court."; return; }

            DOM.authErr.textContent = "Inscription...";

                const snap = await getDoc(ref);

                    DOM.authErr.textContent = "Ce pseudo est déjà pris !";
                } else {
                    await setDoc(ref, {
                        username: pseudo,
                        password: pass, // En clair ici (simple jeu)
                        score: 0
                    });
                    loginSuccess(id, pseudo);
                }
            } catch(e) { DOM.authErr.textContent = "Erreur DB: " + e.message; }
        }

        async function login() {
            const pseudo = DOM.authPseudo.value.trim();
            const pass = DOM.authPass.value;
            if(!pseudo || !pass) return;
            
            const id = sanitize(pseudo);
            DOM.authErr.textContent = "Connexion...";
            
            try {
                const snap = await getDoc(doc(db, "users", id));
                if(!snap.exists()) {
                    DOM.authErr.textContent = "Compte introuvable.";
                } else {
                    if(snap.data().password === pass) {
                        loginSuccess(id, snap.data().username);
                    } else {
                        DOM.authErr.textContent = "Mauvais mot de passe.";
                    }
                }
            } catch(e) { DOM.authErr.textContent = "Erreur DB: " + e.message; }
        }

        function loginSuccess(id, name) {
            myPseudoID = id;
            myPseudoName = name;
            DOM.auth.classList.add('hidden');
            DOM.lobby.classList.remove('hidden');
            DOM.displays.user.textContent = name;
            startLobbyListeners();
        }

        // --- LOBBY ---
        function startLobbyListeners() {
            // Liste des jeux
            onSnapshot(collection(db, "lobby"), (snap) => {
                DOM.displays.games.innerHTML = '';
                if(snap.empty) {
                    DOM.displays.games.innerHTML = '<p class="text-gray-500 p-2">Aucune partie.</p>';
                    return;
                }
                snap.forEach(d => {
                    const g = d.data();
                    const div = document.createElement('div');
                    div.className = "flex justify-between items-center p-2 border-b border-gray-700";
                    
                    const btn = document.createElement('button');
                    btn.className = "bg-red-800 text-white px-3 py-1 rounded text-sm hover:bg-red-600";
                    
                    if(g.hostId === myPseudoID) {
                        btn.textContent = "Supprimer";
                        btn.onclick = () => deleteGame(d.id);
                    } else {
                        btn.textContent = "Rejoindre";
                        btn.onclick = () => joinGame(d.id);
                    }
                    
                    div.innerHTML = `<span>${g.hostName} (${g.difficulty})</span>`;
                    div.appendChild(btn);
                    DOM.displays.games.appendChild(div);
                });
            });

            // Classement
            const q = query(collection(db, "users"), limit(20));
            onSnapshot(q, (snap) => {
                const users = [];
                snap.forEach(d => users.push(d.data()));
                users.sort((a,b) => (b.score||0) - (a.score||0));
                
                DOM.displays.leaders.innerHTML = '';
                users.slice(0,10).forEach((u, i) => {
                   const div = document.createElement('div');
                   div.className = "flex justify-between text-sm p-1";
                   div.innerHTML = `<span>${i+1}. ${u.username}</span><span class="text-yellow-500">${u.score||0}</span>`;
                   DOM.displays.leaders.appendChild(div);
                });
            });
        }

        async function createGame(diff, cat) {
            if(!cat) { openCatModal(diff); return; }
            
            const words = WORD_CATEGORIES[cat];
            const word = words[Math.floor(Math.random() * words.length)];
            
            let description = null;
            if (cat === "Ships (Couples)") {
                const shipObj = SHIP_DATA_RAW.find(s => s.ship.toUpperCase() === word);
                if (shipObj) description = shipObj.personnages.join(" + ");
            }

            try {
                const gRef = await addDoc(collection(db, "games"), {
                    hostId: myPseudoID,
                    word: word,
                    category: cat,
                    wordDescription: description || null,
                    difficulty: diff,
                    guesses: [],
                    wrongs: 0,
                    status: 'playing',
                    players: [myPseudoID],
                    playerNames: { [myPseudoID]: myPseudoName },
                    scores: { [myPseudoID]: 0 },
                    turn: myPseudoID,
                    usedWords: [word]
                });
                
                await setDoc(doc(db, "lobby", gRef.id), {
                    hostId: myPseudoID,
                    hostName: myPseudoName,
                    difficulty: diff,
                    date: serverTimestamp()
                });
                
                joinGame(gRef.id);
            } catch(e) { console.error(e); }
        }

        function openCatModal(diff) {
            DOM.catList.innerHTML = '';
            Object.keys(WORD_CATEGORIES).forEach(cat => {
                const btn = document.createElement('button');
                btn.textContent = cat;
                btn.className = "category-selection-button";
                btn.onclick = () => {
                    DOM.modal.classList.add('hidden');
                    createGame(diff, cat);
                };
                DOM.catList.appendChild(btn);
            });
            DOM.modal.classList.remove('hidden');
        }

        async function joinGame(id) {
            currentGameId = id;
            if(unsubGame) unsubGame();
            
            // Ajout joueur
            const gRef = doc(db, "games", id);
            try {
                const snap = await getDoc(gRef);
                if(snap.exists()) {
                    const d = snap.data();
                    if(!d.players.includes(myPseudoID)) {
                        await updateDoc(gRef, {
                            players: [...d.players, myPseudoID],
                            [`playerNames.${myPseudoID}`]: myPseudoName,
                            [`scores.${myPseudoID}`]: 0
                        });
                    }
                }
            } catch(e) {}

            DOM.lobby.classList.add('hidden');
            DOM.game.classList.remove('hidden');
            
            unsubGame = onSnapshot(gRef, (snap) => {
                if(!snap.exists()) { leaveGame(); alert("Partie terminée."); return; }
                renderGame(snap.data());
            });
        }

        async function deleteGame(id) {
            await deleteDoc(doc(db, "lobby", id));
            await deleteDoc(doc(db, "games", id));
        }

        function leaveGame() {
            if(unsubGame) unsubGame();
            currentGameId = null;
            DOM.game.classList.add('hidden');
            DOM.displays.status.classList.add('hidden');
            DOM.lobby.classList.remove('hidden');
        }

        // --- JEU ---
        function renderGame(data) {
            // UI Info
            DOM.displays.cat.textContent = data.category;
            DOM.displays.guesses.textContent = MAX_GUESSES - data.wrongs;
            
            // Tour
            const isMyTurn = data.turn === myPseudoID;
            const turnName = data.playerNames[data.turn] || '?';
            DOM.displays.turn.textContent = isMyTurn ? "C'EST TON TOUR !" : `Tour de ${turnName}`;
            DOM.displays.turn.className = isMyTurn ? "text-xl font-bold text-yellow-400 animate-pulse" : "text-xl text-gray-500";

            // Mot
            DOM.displays.word.innerHTML = '';
            data.word.split('').forEach(char => {
                const s = document.createElement('span');
                s.className = "word-display-letter mx-1 text-2xl";
                if(char === ' ') { s.className="mx-2 w-4"; s.textContent = ""; }
                else { s.textContent = data.guesses.includes(char) ? char : '_'; }
                DOM.displays.word.appendChild(s);
            });

            // Pendu
            DOM.displays.hangman.forEach((el, i) => {
                el.style.visibility = i < data.wrongs ? 'visible' : 'hidden';
            });

            // Clavier
            DOM.displays.keyboard.innerHTML = '';
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(char => {
                const btn = document.createElement('button');
                btn.textContent = char;
                btn.className = "key w-8 h-10 rounded m-1 font-bold";
                const played = data.guesses.includes(char);
                
                if(played) {
                    btn.disabled = true;
                    btn.style.opacity = "0.3";
                    if(data.word.includes(char)) btn.style.backgroundColor = "green";
                } else if(!isMyTurn || data.status !== 'playing') {
                    btn.disabled = true;
                    btn.style.opacity = "0.5";
                } else {
                    btn.onclick = () => playMove(char);
                }
                DOM.displays.keyboard.appendChild(btn);
            });

            // Fin ?
            if(data.status !== 'playing') {
                DOM.displays.status.classList.remove('hidden');
                const won = data.status === 'won';
                DOM.displays.msg.textContent = won ? "VICTOIRE !" : "PERDU...";
                DOM.displays.msg.className = won ? "text-5xl font-bold text-green-500 mb-4" : "text-5xl font-bold text-red-500 mb-4";
                
                let resText = data.word;
                if (data.wordDescription) resText += `\n(${data.wordDescription})`;
                DOM.displays.res.textContent = resText;
                
                DOM.displays.img.classList.toggle('hidden', won); // Affiche Alastor si perdu
                
                // Bouton Replay (Host seulement)
                const isHost = data.hostId === myPseudoID;
                DOM.btns.replay.classList.toggle('hidden', !isHost);
                DOM.btns.replay.onclick = () => replay(data);
            } else {
                DOM.displays.status.classList.add('hidden');
            }
        }

        async function playMove(char) {
            if(!currentGameId) return;
            const ref = doc(db, "games", currentGameId);
            
            await runTransaction(db, async (t) => {
                const snap = await t.get(ref);
                const d = snap.data();
                if(d.status !== 'playing' || d.turn !== myPseudoID || d.guesses.includes(char)) return;

                const nextGuesses = [...d.guesses, char];
                let nextWrongs = d.wrongs;
                let hit = d.word.includes(char);
                if(!hit) nextWrongs++;

                // Check win/loss
                const allFound = d.word.replace(/ /g,'').split('').every(c => nextGuesses.includes(c));
                let nextStatus = 'playing';
                if(allFound) nextStatus = 'won';
                if(nextWrongs >= MAX_GUESSES) nextStatus = 'lost';

                // Next Turn
                let nextTurn = d.turn;
                if(!hit && nextStatus === 'playing') {
                    const idx = d.players.indexOf(myPseudoID);
                    nextTurn = d.players[(idx + 1) % d.players.length];
                }

                // Score
                if(nextStatus === 'won') {
                    t.update(doc(db, "users", myPseudoID), { score: increment(1) });
                }

                t.update(ref, {
                    guesses: nextGuesses,
                    wrongs: nextWrongs,
                    status: nextStatus,
                    turn: nextTurn
                });
            });
        }

        async function replay(oldData) {
            const words = WORD_CATEGORIES[oldData.category];
            const newWord = words[Math.floor(Math.random()*words.length)];
            const nextP = oldData.players[(oldData.players.indexOf(oldData.turn)+1)%oldData.players.length];

            let description = null;
            if (oldData.category === "Ships (Couples)") {
                const shipObj = SHIP_DATA_RAW.find(s => s.ship.toUpperCase() === newWord);
                if (shipObj) description = shipObj.personnages.join(" + ");
            }

            await updateDoc(doc(db, "games", currentGameId), {
                word: newWord,
                wordDescription: description || null,
                guesses: [],
                wrongs: 0,
                status: 'playing',
                turn: nextP
            });
        }

        // --- EVENTS ---
        DOM.btns.login.onclick = login;
        DOM.btns.register.onclick = register;
        DOM.btns.easy.onclick = () => createGame('facile');
        DOM.btns.hard.onclick = () => createGame('difficile');
        DOM.btns.leave.onclick = leaveGame;
        DOM.btns.backLobby.onclick = leaveGame;
        DOM.btns.logout.onclick = () => location.reload();
        DOM.btns.cancelCat.onclick = () => DOM.modal.classList.add('hidden');

        // Essai de charger l'image de fond
        const bgImg = new Image();
        bgImg.onload = () => document.body.classList.add('bg-loaded');
        bgImg.src = './image/backround.jpg';

        // START
        initNetwork();

    </script>
</body>
</html>
